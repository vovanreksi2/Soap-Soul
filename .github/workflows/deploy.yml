# Builds and tests every push and pull request. On `main`: deploys the infrastructure (infra/main.bicep),
# then the app onto it. One-time Azure setup and the repository variables it needs: docs/deploy/azure.md
name: Build and deploy

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Install browser for UI tests
        run: pwsh tests/SoapAndSoul.UI.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Validate infrastructure
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Publish
        run: dotnet publish src/SoapAndSoul.Api -c Release --no-build -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: publish
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    permissions:
      contents: read
      id-token: write # OIDC login to Azure
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: infra

      - uses: actions/download-artifact@v4
        with:
          name: app
          path: app

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        id: infra
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          outputs=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "soapandsoul-${{ github.run_number }}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --query properties.outputs --output json)
          echo "webAppName=$(jq -r .webAppName.value <<< "$outputs")" >> "$GITHUB_OUTPUT"

      - name: Deploy app
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.infra.outputs.webAppName }}
          package: app

      - name: Smoke test
        env:
          APP_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$APP_URL/healthz"; then echo; exit 0; fi
            sleep 10
          done
          echo "::error::$APP_URL/healthz did not respond after deploy"
          exit 1
